<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alec Douglas-Home - 3D Face Model</title>
    <!-- Google Model Viewer for GLTF/GLB -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121214;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 24px 16px 12px;
        }
        h1 {
            margin: 0 0 8px 0;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
        }
        p {
            color: #a0a0a5;
            margin: 4px 0;
            font-size: 0.95rem;
        }
        .container {
            width: 90vw;
            max-width: 800px;
            height: 550px;
            background: radial-gradient(circle at center, #252830 0%, #151619 100%);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
            margin: 16px 0;
        }
        model-viewer {
            width: 100%;
            height: 100%;
        }
        .badge-bar {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .badge {
            background: #20242c;
            border: 1px solid #363b47;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #38ef7d;
        }
        .instructions {
            background: #1c1f26;
            border-left: 4px solid #11998e;
            padding: 12px 18px;
            border-radius: 4px;
            max-width: 760px;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Alec Douglas-Home (1963)</h1>
        <p>Parametric 3D Face Reconstruction &bull; GLB Model Preview</p>
        <div class="badge-bar">
            <span class="badge">&check; Valid glTF 2.0 (GLB)</span>
            <span class="badge">&check; File size: ~254 KB (&lt; 2 MB)</span>
            <span class="badge">&check; 4,225 Vertices &bull; 8,192 Triangles</span>
        </div>
    </header>

    <div class="container">
        <model-viewer 
            src="face.glb" 
            alt="3D Face Model of Alec Douglas-Home" 
            auto-rotate 
            camera-controls 
            rotation-per-second="30deg"
            shadow-intensity="1"
            exposure="1.0"
            ar>
        </model-viewer>
    </div>

    <div class="instructions">
        <strong>Controls:</strong> Left-click and drag to rotate the 3D model in 360&deg;. Scroll to zoom in and out. Right-click and drag to pan.
    </div>
</body>
</html>
